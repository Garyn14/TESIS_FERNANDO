# DRA-78: revisión estática con SonarQube Cloud (plan gratuito, proyecto público).
# El análisis lo corre la CI (job "Revisión estática (SonarQube Cloud)"); el análisis automático
# de SonarQube Cloud está desactivado. El token va solo en el secreto SONAR_TOKEN de GitHub.
sonar.projectKey=Garyn14_TESIS_FERNANDO
sonar.organization=garyn14
sonar.projectName=Plataforma de documentos con blockchain - DRA Satipo
sonar.sourceEncoding=UTF-8

# "Código nuevo" = lo que cambia respecto de main (en una rama DRA-*, lo de esa rama).
sonar.newCode.referenceBranch=main

# Código de la plataforma: backend, plataforma interna, portal e infraestructura.
sonar.sources=plataforma/backend/src/main/java,\
  plataforma/frontend/src,\
  plataforma/portal/src,\
  plataforma/infra,\
  plataforma/e2e
sonar.tests=plataforma/backend/src/test/java,\
  plataforma/frontend/src,\
  plataforma/portal/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/src/test/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/src/test/**,\
  **/node_modules/**,**/dist/**,**/target/**,**/coverage/**,\
  **/.terraform/**,**/*.png,**/*.md,\
  plataforma/infra/besu/red/**,plataforma/infra/ipfs/datos/**

# Pruebas de la plantilla de la cuenta de AWS (infra/aws/cuenta/tests).
sonar.python.version=3.12

# El contrato Solidity se revisa con Slither (job "Revisión estática (contrato y secretos)").

# Java: clases compiladas y cobertura de JaCoCo (artefactos del job del backend).
sonar.java.source=21
sonar.java.binaries=plataforma/backend/target/classes
sonar.java.test.binaries=plataforma/backend/target/test-classes
sonar.java.libraries=plataforma/backend/target/dependency/*.jar
sonar.java.test.libraries=plataforma/backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=plataforma/backend/target/site/jacoco/jacoco.xml

# TypeScript: cobertura de Vitest (lcov) de la plataforma interna y del portal.
sonar.javascript.lcov.reportPaths=plataforma/frontend/coverage/lcov.info,\
  plataforma/portal/coverage/lcov.info
# Las pruebas de punta a punta y la infraestructura no tienen pruebas unitarias.
sonar.coverage.exclusions=plataforma/e2e/**,plataforma/infra/**

# DRA-80: hallazgos revisados uno por uno en docs/calidad/medicion-inicial.md que no son defectos
# (FP: falso positivo) o que son decisiones tomadas (aceptado). Se excluyen por regla y archivo.
# Nunca agregar una exclusión sin revisar antes el hallazgo y anotar aquí por qué.
sonar.issue.ignore.multicriteria=fp1,fp2,fp3,fp4,fp5,fp6,fp7,fp8,fp9,fp10,fp11,fp12,fp13,fp14,ac1,ac2,ac3,ac4,ac5,ac6
# FP: Month es un enum; compararlo con != es correcto.
sonar.issue.ignore.multicriteria.fp1.ruleKey=java:S8696
sonar.issue.ignore.multicriteria.fp1.resourceKey=**/documentos/PlantillasDeDocumento.java
# FP: no es una contraseña, es un hash ficticio para igualar tiempos y no revelar si existe el usuario.
sonar.issue.ignore.multicriteria.fp2.ruleKey=java:S6437
sonar.issue.ignore.multicriteria.fp2.resourceKey=**/sesion/AutenticacionUsuarios.java
# FP: solo elige el mensaje "su sesión expiró"; no se usa para autenticar.
sonar.issue.ignore.multicriteria.fp3.ruleKey=java:S2254
sonar.issue.ignore.multicriteria.fp3.resourceKey=**/sesion/RespuestasDeSeguridad.java
# FP: el SQL solo recibe fragmentos constantes; lo que escribe el usuario va como parámetro.
sonar.issue.ignore.multicriteria.fp4.ruleKey=java:S2077
sonar.issue.ignore.multicriteria.fp4.resourceKey=**/catalogo/GestionCatalogo.java
sonar.issue.ignore.multicriteria.fp5.ruleKey=java:S2077
sonar.issue.ignore.multicriteria.fp5.resourceKey=**/consulta/BusquedaDeDocumentos.java
# FP: la cookie CSRF debe poder leerla el navegador (patrón de Spring para una SPA).
sonar.issue.ignore.multicriteria.fp6.ruleKey=java:S3330
sonar.issue.ignore.multicriteria.fp6.resourceKey=**/config/SeguridadConfig.java
# FP: la dirección se arma con el código validado o el token del QR, siempre hacia la misma API.
sonar.issue.ignore.multicriteria.fp7.ruleKey=tssecurity:S8476
sonar.issue.ignore.multicriteria.fp7.resourceKey=plataforma/portal/src/api.ts
# FP: clave de una base de datos de prueba, desechable, en Docker.
sonar.issue.ignore.multicriteria.fp8.ruleKey=secrets:S2068
sonar.issue.ignore.multicriteria.fp8.resourceKey=plataforma/infra/aws/servidor/probar-servidor.sh
# FP: HTTP hacia servicios internos del mismo servidor, que no salen a internet.
sonar.issue.ignore.multicriteria.fp9.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.fp9.resourceKey=plataforma/infra/aws/servidor/vigilar.sh
# FP: pruebas de punta a punta (y las de infra/aws/pruebas) que corren en la máquina del equipo; el SQL y los comandos los
# escribe la prueba, sin entrada de usuario. Los textos se ordenan alfabéticamente a propósito.
sonar.issue.ignore.multicriteria.fp10.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fp10.resourceKey=plataforma/e2e/**
sonar.issue.ignore.multicriteria.fp14.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.fp14.resourceKey=plataforma/infra/aws/pruebas/**
sonar.issue.ignore.multicriteria.fp11.ruleKey=jssecurity:S6350
sonar.issue.ignore.multicriteria.fp11.resourceKey=plataforma/e2e/**
sonar.issue.ignore.multicriteria.fp12.ruleKey=javascript:S2871
sonar.issue.ignore.multicriteria.fp12.resourceKey=plataforma/e2e/**
# FP (estilo): [ en lugar de [[ en bash; shellcheck ya revisa estos scripts en la CI.
sonar.issue.ignore.multicriteria.fp13.ruleKey=shell:S7688
sonar.issue.ignore.multicriteria.fp13.resourceKey=**/*.sh
# Aceptado: el servidor tiene IP pública por costo (sin NAT, balanceador ni IP elástica, escenario A);
# su grupo de seguridad solo deja entrar a CloudFront.
sonar.issue.ignore.multicriteria.ac1.ruleKey=terraform:S6329
sonar.issue.ignore.multicriteria.ac1.resourceKey=plataforma/infra/aws/modulos/ambiente/servidor.tf
# Aceptado: sin registros de acceso de S3 y CloudFront en QA, por costo. Se reconsidera en PROD (DRA-65).
sonar.issue.ignore.multicriteria.ac2.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.ac2.resourceKey=plataforma/infra/aws/modulos/ambiente/*.tf
sonar.issue.ignore.multicriteria.ac3.ruleKey=cloudformation:S6258
sonar.issue.ignore.multicriteria.ac3.resourceKey=plataforma/infra/aws/cuenta/cuenta.yml
# Aceptado: las alertas no llevan datos sensibles y cifrarlas con KMS tiene costo mensual.
sonar.issue.ignore.multicriteria.ac4.ruleKey=cloudformation:S6327
sonar.issue.ignore.multicriteria.ac4.resourceKey=plataforma/infra/aws/cuenta/cuenta.yml
# Aceptado: Hardhat y otras dependencias necesitan sus scripts de instalación; Dependabot las vigila.
sonar.issue.ignore.multicriteria.ac5.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.ac5.resourceKey=**/*.sh
# Aceptado: el cursor va al campo de la ventana recién abierta, como piden las pautas de los diálogos.
sonar.issue.ignore.multicriteria.ac6.ruleKey=typescript:S9379
sonar.issue.ignore.multicriteria.ac6.resourceKey=plataforma/frontend/src/catalogo/PaginaAreas.tsx
