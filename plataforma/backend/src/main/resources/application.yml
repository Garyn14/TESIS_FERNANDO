spring:
  application:
    name: plataforma-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plataforma}
    username: ${DB_USER:plataforma}
    password: ${DB_PASSWORD:plataforma}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

# Sesión del servidor (HU03, RNF02): expira tras 30 minutos de inactividad.
server:
  servlet:
    session:
      timeout: ${SESION_INACTIVIDAD:30m}
      cookie:
        http-only: true
        same-site: lax
        # true en producción (HTTPS); en desarrollo local se usa HTTP.
        secure: ${SESION_COOKIE_SEGURA:false}

management:
  endpoints:
    web:
      exposure:
        include: health

plataforma:
  version: '@project.version@'
  besu:
    rpc-url: ${BESU_RPC_URL:http://localhost:8545}
  # Red y contrato para la billetera del navegador (HU06). Sin contrato, la pantalla de billeteras
  # avisa que la blockchain no está configurada.
  blockchain:
    chain-id: ${BESU_CHAIN_ID:20260}
    nombre: ${BESU_NOMBRE_RED:Plataforma DRA Satipo}
    rpc-publica: ${BESU_RPC_PUBLICA:http://localhost:8545}
    contrato: ${PLATAFORMA_CONTRATO_DIRECCION:}
  # Portal público de verificación (HU16, RF36): su dirección va en el código QR y en la leyenda del
  # PDF. El portal se construye en el Sprint 5.
  portal:
    url: ${PLATAFORMA_PORTAL_URL:http://localhost:5174}
  # API del nodo IPFS privado (HU17, DRA-46), donde se guardan los PDF finales. Solo escucha en el
  # servidor (127.0.0.1): nunca se expone a Internet (RNF03).
  ipfs:
    url: ${PLATAFORMA_IPFS_URL:http://localhost:5001}
    tiempo-maximo: ${PLATAFORMA_IPFS_TIEMPO_MAXIMO:30s}
  # Sincronización con la blockchain (HU18): lee los eventos del contrato desde el bloque en que se
  # desplegó y devuelve a Pendiente lo detenido en Procesando firma pasado el plazo.
  sincronizacion:
    activa: ${PLATAFORMA_SINCRONIZACION_ACTIVA:true}
    intervalo: ${PLATAFORMA_SINCRONIZACION_INTERVALO:30s}
    bloque-inicial: ${PLATAFORMA_CONTRATO_BLOQUE_INICIAL:0}
    plazo-firma: ${PLATAFORMA_FIRMA_PLAZO:15m}
  # Clave del HMAC-SHA256 del DNI (HU08, RF17), de al menos 32 caracteres. En AWS va en el gestor
  # de secretos (RNF03). Sin clave no se registran documentos.
  dni:
    clave-hmac: ${PLATAFORMA_CLAVE_HMAC_DNI:}
  # Primera cuenta de Administrador (RF09). Sin contraseña no se crea la cuenta.
  inicializacion:
    admin-usuario: ${PLATAFORMA_ADMIN_USUARIO:admin}
    admin-nombre: ${PLATAFORMA_ADMIN_NOMBRE:Administrador de la plataforma}
    admin-contrasena: ${PLATAFORMA_ADMIN_CONTRASENA:}
