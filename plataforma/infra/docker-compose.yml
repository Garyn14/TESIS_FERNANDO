# Servicios para desarrollo local. Besu e IPFS se agregan en DRA-45 y DRA-46.
name: plataforma

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-plataforma}
      POSTGRES_USER: ${DB_USER:-plataforma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plataforma}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
