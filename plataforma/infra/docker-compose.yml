# Servicios para desarrollo local.
#   docker compose up -d                                 -> solo PostgreSQL
#   docker compose --profile besu up -d                  -> + red Besu QBFT de 4 validadores
#   docker compose --profile ipfs up -d                  -> + nodo IPFS privado
#   docker compose --profile besu --profile ipfs up -d   -> todo
# Una sola vez antes de usar los perfiles: ./besu/generar-red.sh y ./ipfs/generar-clave.sh
name: plataforma

x-besu: &besu
  image: hyperledger/besu:${BESU_VERSION:-26.10.2}
  profiles: [besu]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-plataforma}
      POSTGRES_USER: ${DB_USER:-plataforma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plataforma}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [plataforma]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nodo 1: validador y nodo de arranque. Es el único que expone RPC fuera de Docker
  # (backend, Hardhat y MetaMask se conectan a http://localhost:8545).
  besu-nodo1:
    <<: *besu
    command: --config-file=/red/nodo1/config.toml
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - ./besu/red:/red:ro
      - besu-nodo1:/opt/besu/data
    networks:
      plataforma:
        ipv4_address: 172.30.0.11

  besu-nodo2:
    <<: *besu
    command: --config-file=/red/nodo2/config.toml
    volumes:
      - ./besu/red:/red:ro
      - besu-nodo2:/opt/besu/data
    networks:
      plataforma:
        ipv4_address: 172.30.0.12

  besu-nodo3:
    <<: *besu
    command: --config-file=/red/nodo3/config.toml
    volumes:
      - ./besu/red:/red:ro
      - besu-nodo3:/opt/besu/data
    networks:
      plataforma:
        ipv4_address: 172.30.0.13

  besu-nodo4:
    <<: *besu
    command: --config-file=/red/nodo4/config.toml
    volumes:
      - ./besu/red:/red:ro
      - besu-nodo4:/opt/besu/data
    networks:
      plataforma:
        ipv4_address: 172.30.0.14

  # Nodo IPFS privado (Kubo) donde se guardan los PDF firmados (RNF03, HU17).
  # La API y el gateway solo se publican en 127.0.0.1: no quedan expuestos a la red local.
  ipfs:
    image: ipfs/kubo:${KUBO_VERSION:-v0.43.1}
    profiles: [ipfs]
    restart: unless-stopped
    environment:
      # Kubo se niega a arrancar si no encuentra la clave de enjambre
      LIBP2P_FORCE_PNET: "1"
      IPFS_SWARM_KEY_FILE: /red/swarm.key
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8081:8080"
    volumes:
      - ./ipfs/red:/red:ro
      - ./ipfs/init:/container-init.d:ro
      - ipfs-data:/data/ipfs
    networks:
      plataforma:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  ipfs-data:
  besu-nodo1:
  besu-nodo2:
  besu-nodo3:
  besu-nodo4:

networks:
  plataforma:
    ipam:
      config:
        - subnet: 172.30.0.0/24
