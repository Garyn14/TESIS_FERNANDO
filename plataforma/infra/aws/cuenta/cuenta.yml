AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  DRA Satipo (DRA-53, DRA-56) - Preparacion de la cuenta, una sola vez: usuario de IAM para los
  disparadores de GitHub Actions, bucket del estado de Terraform y presupuesto con alertas.

# Se crea en la región us-east-2 (Ohio), la que AWS asigna a la cuenta: desde la consola
# (CloudFormation -> Crear pila) o con el CLI. Guía: docs/arquitectura/despliegue-aws.md
#
# Lo que esta pila NO crea: el ambiente de QA en sí (lo crea el disparador "QA – Encender").
# Borrar esta pila no borra QA; el bucket del estado se conserva a propósito (DeletionPolicy).
#
# DRA-56: la cuenta es de la experiencia nueva de AWS, cuya política de organización prohíbe
# crear proveedores de identidad (iam:*Provider*), así que GitHub no puede entrar con OIDC. Entra
# con este usuario de IAM y una clave de acceso que se crea APARTE (no en la plantilla, porque
# quedaría a la vista en los resultados de la pila) y se guarda solo como secreto del ambiente
# "qa" de GitHub. La clave se cambia cada 90 días (guía, sección 8).

Parameters:
  AmbienteGitHub:
    Type: String
    Default: qa
    Description: Ambiente de GitHub (Settings -> Environments) que guarda la clave como secreto.
    AllowedPattern: '^[a-z0-9-]+$'
  CorreoAlertas:
    Type: String
    Description: Correo que recibe las alertas de gasto del presupuesto y las del monitoreo (DRA-68).
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

Resources:
  # Usuario de los disparadores de QA: solo acceso programático (sin contraseña de consola).
  UsuarioGitHub:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'dra-satipo-github-${AmbienteGitHub}'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess'
      Policies:
        # IAM solo para el rol y el perfil del servidor, y para el rol de los respaldos (DRA-66),
        # con nombres dra-satipo-*.
        - PolicyName: iam-del-servidor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RolesYPerfilesDelProyecto
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:ListRoleTags
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListInstanceProfilesForRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:ListInstanceProfileTags
                  - iam:UntagInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dra-satipo-*-servidor'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/dra-satipo-*-servidor'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dra-satipo-*-respaldos'
              # Al rol del servidor solo se le puede adjuntar la política de SSM administrada por AWS.
              - Sid: SoloLaPoliticaDeSsm
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dra-satipo-*-servidor'
                Condition:
                  ArnEquals:
                    'iam:PolicyARN': !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
              # El rol del servidor solo se entrega a EC2.
              - Sid: EntregarElRolAlServidor
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dra-satipo-*-servidor'
                Condition:
                  StringEquals:
                    'iam:PassedToService': ec2.amazonaws.com
              # DRA-66: al rol de los respaldos solo se le adjunta la política de Data Lifecycle
              # Manager administrada por AWS, y solo se entrega a ese servicio.
              - Sid: SoloLaPoliticaDeRespaldos
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dra-satipo-*-respaldos'
                Condition:
                  ArnEquals:
                    'iam:PolicyARN': !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole'
              - Sid: EntregarElRolDeRespaldosADlm
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dra-satipo-*-respaldos'
                Condition:
                  StringEquals:
                    'iam:PassedToService': dlm.amazonaws.com
              - Sid: LeerPoliticasAdministradas
                Effect: Allow
                Action: [iam:GetPolicy, iam:GetPolicyVersion]
                Resource: !Sub 'arn:${AWS::Partition}:iam::aws:policy/*'

  # Estado de Terraform: privado, cifrado y con versiones (se puede recuperar una versión anterior).
  # Se conserva aunque se borre la pila.
  BucketEstado:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'dra-satipo-terraform-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: versiones-antiguas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  PoliticaBucketEstado:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketEstado
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BucketEstado.Arn
              - !Sub '${BucketEstado.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # Alertas del monitoreo (DRA-68): las alarmas de CloudWatch y la regla de copias fallidas de cada
  # ambiente (modulos/ambiente/monitoreo.tf) publican aquí, y AWS las manda por correo. El correo
  # queda en la pila, no en el repositorio. AWS envía un enlace para confirmar la suscripción.
  TemaAlertas:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dra-satipo-alertas
      DisplayName: DRA Satipo
      Subscription:
        - Protocol: email
          Endpoint: !Ref CorreoAlertas

  # Solo las alarmas y las reglas de esta cuenta pueden publicar en el tema.
  PoliticaTemaAlertas:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref TemaAlertas]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AlarmasYReglasDeEstaCuenta
            Effect: Allow
            Principal:
              Service: [cloudwatch.amazonaws.com, events.amazonaws.com]
            Action: sns:Publish
            Resource: !Ref TemaAlertas
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  # Presupuesto de TODA la cuenta. Los créditos NO se descuentan (IncludeCredit: false): si se
  # descontaran, el gasto neto sería $0 mientras dure el crédito y las alertas nunca llegarían.
  # Avisa al gastar $10, $25 y $50 en el mes, y si el pronóstico del mes supera $25.
  Presupuesto:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: dra-satipo-cuenta
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 50
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
          IncludeTax: true
          IncludeSupport: true
          IncludeSubscription: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          IncludeUpfront: true
          IncludeDiscount: true
          UseBlended: false
          UseAmortized: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CorreoAlertas
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CorreoAlertas
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CorreoAlertas
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CorreoAlertas

Outputs:
  UsuarioGitHub:
    Description: 'Usuario al que se le crea la clave que va en los secretos del ambiente qa de GitHub'
    Value: !Ref UsuarioGitHub
  BucketEstado:
    Description: 'Copiar en GitHub: Settings -> Environments -> qa -> variable TF_ESTADO_BUCKET'
    Value: !Ref BucketEstado
