name: CI

on:
  push:
    branches: [main, 'DRA-*']
  pull_request:

jobs:
  backend:
    name: Backend (Java + Spring Boot)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plataforma/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formato, compilación y pruebas
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  portal:
    name: Portal (React + Vite)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  contracts:
    name: Contratos (Hardhat)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/contracts/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run compile
      - run: npm test

  red-besu:
    name: Red Besu (QBFT, 4 validadores)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/contracts/package-lock.json
      - name: Generar claves y génesis
        run: plataforma/infra/besu/generar-red.sh
      - name: Levantar los 4 nodos
        working-directory: plataforma/infra
        run: docker compose --profile besu up -d besu-nodo1 besu-nodo2 besu-nodo3 besu-nodo4
      - name: Esperar bloques
        run: |
          for i in $(seq 1 60); do
            n=$(curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://localhost:8545 | jq -r '.result // "0x0"')
            [ $((n)) -ge 3 ] && echo "Bloque $((n))" && exit 0
            sleep 2
          done
          echo "La red no produjo bloques" && exit 1
      - run: npm ci
        working-directory: plataforma/contracts
      - name: Desplegar contrato de prueba y leer el evento
        # Normalmente tarda menos de un minuto; si la red se traba, falla rápido.
        timeout-minutes: 5
        working-directory: plataforma/contracts
        env:
          BESU_RPC_URL: http://localhost:8545
        run: npm run probar:besu
      - name: Contrato RegistroDocumentos en Besu (HU06)
        # Normalmente tarda menos de un minuto; si la red se traba, falla rápido.
        timeout-minutes: 5
        working-directory: plataforma/contracts
        env:
          BESU_RPC_URL: http://localhost:8545
        run: npm run probar:registro
      - name: Registros de los nodos si falla
        if: failure()
        working-directory: plataforma/infra
        run: docker compose --profile besu logs --tail 100

  ipfs:
    name: IPFS privado
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/infra
    steps:
      - uses: actions/checkout@v7
      - name: Generar la clave de enjambre
        run: ./ipfs/generar-clave.sh
      - name: Levantar el nodo IPFS
        run: docker compose --profile ipfs up -d --wait ipfs
      - name: Red privada y subida/recuperación por CID
        run: ./ipfs/probar-ipfs.sh
      - name: Aislamiento (nodo sin clave rechazado, con clave conectado)
        run: ./ipfs/probar-aislamiento.sh
      - name: Registros del nodo si falla
        if: failure()
        run: docker compose --profile ipfs logs --tail 100

  infra-aws:
    name: Infraestructura AWS (Terraform y servidor)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plataforma/infra/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - name: Formato de Terraform
        run: terraform fmt -recursive -check
      - name: Validar el ambiente QA
        working-directory: plataforma/infra/aws/qa
        run: terraform init -backend=false -input=false && terraform validate
      - name: Pruebas de la plantilla (proveedores simulados, sin cuenta de AWS)
        working-directory: plataforma/infra/aws/modulos/ambiente
        run: terraform init -input=false && terraform test
      - name: Revisar los scripts del servidor
        run: shellcheck servidor/*.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Construir el backend
        working-directory: plataforma/backend
        run: ./mvnw -B -q package -DskipTests
      - name: Servidor de AWS en Docker (nginx, /rpc, HU20 y persistencia)
        run: ./servidor/probar-servidor.sh ../../backend/target/plataforma-backend-*.jar
