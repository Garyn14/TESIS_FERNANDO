name: CI

on:
  push:
    branches: [main, 'DRA-*']
  pull_request:

jobs:
  backend:
    name: Backend (Java + Spring Boot)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plataforma/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formato, compilación y pruebas
        run: ./mvnw -B verify
      # DRA-78: clases compiladas y cobertura (JaCoCo) para la revisión estática.
      - uses: actions/upload-artifact@v7
        with:
          name: backend-analisis
          path: |
            plataforma/backend/target/classes
            plataforma/backend/target/test-classes
            plataforma/backend/target/site/jacoco/jacoco.xml
          retention-days: 3

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # DRA-78: con la cobertura (lcov) para la revisión estática.
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-cobertura
          path: plataforma/frontend/coverage/lcov.info
          retention-days: 3
      - run: npm run build

  portal:
    name: Portal (React + Vite)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # DRA-78: con la cobertura (lcov) para la revisión estática.
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: portal-cobertura
          path: plataforma/portal/coverage/lcov.info
          retention-days: 3
      - run: npm run build

  contracts:
    name: Contratos (Hardhat)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/contracts/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run compile
      - run: npm test

  red-besu:
    name: Red Besu (QBFT, 4 validadores)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/contracts/package-lock.json
      - name: Generar claves y génesis
        run: plataforma/infra/besu/generar-red.sh
      - name: Levantar los 4 nodos
        working-directory: plataforma/infra
        run: docker compose --profile besu up -d besu-nodo1 besu-nodo2 besu-nodo3 besu-nodo4
      - name: Esperar bloques
        run: |
          for _ in $(seq 1 60); do
            n=$(curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://localhost:8545 | jq -r '.result // "0x0"')
            [ $((n)) -ge 3 ] && echo "Bloque $((n))" && exit 0
            sleep 2
          done
          echo "La red no produjo bloques" && exit 1
      - run: npm ci
        working-directory: plataforma/contracts
      - name: Desplegar contrato de prueba y leer el evento
        # Normalmente tarda menos de un minuto; si la red se traba, falla rápido.
        timeout-minutes: 5
        working-directory: plataforma/contracts
        env:
          BESU_RPC_URL: http://localhost:8545
        run: npm run probar:besu
      - name: Contrato RegistroDocumentos en Besu (HU06)
        # Normalmente tarda menos de un minuto; si la red se traba, falla rápido.
        timeout-minutes: 5
        working-directory: plataforma/contracts
        env:
          BESU_RPC_URL: http://localhost:8545
        run: npm run probar:registro
      - name: Registros de los nodos si falla
        if: failure()
        working-directory: plataforma/infra
        run: docker compose --profile besu logs --tail 100

  ipfs:
    name: IPFS privado
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plataforma/infra
    steps:
      - uses: actions/checkout@v7
      - name: Generar la clave de enjambre
        run: ./ipfs/generar-clave.sh
      - name: Levantar el nodo IPFS
        run: docker compose --profile ipfs up -d --wait ipfs
      - name: Red privada y subida/recuperación por CID
        run: ./ipfs/probar-ipfs.sh
      - name: Aislamiento (nodo sin clave rechazado, con clave conectado)
        run: ./ipfs/probar-aislamiento.sh
      - name: Registros del nodo si falla
        if: failure()
        run: docker compose --profile ipfs logs --tail 100

  infra-aws:
    name: Infraestructura AWS (Terraform y servidor)
    runs-on: ubuntu-latest
    # Sin límite, un paso colgado consume hasta 6 horas de minutos de CI.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plataforma/infra/aws
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - name: Formato de Terraform
        run: terraform fmt -recursive -check
      - name: Validar el ambiente QA
        working-directory: plataforma/infra/aws/qa
        run: terraform init -backend=false -input=false && terraform validate
      - name: Pruebas de la plantilla (proveedores simulados, sin cuenta de AWS)
        working-directory: plataforma/infra/aws/modulos/ambiente
        run: terraform init -input=false && terraform test
      - name: Plantilla de la cuenta (cfn-lint y pruebas)
        working-directory: plataforma/infra/aws/cuenta
        run: |
          pip install --quiet cfn-lint==1.60.0
          cfn-lint cuenta.yml
          python3 -m unittest discover -s tests -v
      - name: Función de CloudFront del portal (rutas /verificar/{token})
        run: node --test modulos/ambiente/tests/rutas-del-portal.test.cjs
      - name: Revisar los scripts del servidor
        run: shellcheck servidor/*.sh pruebas/*.sh acciones/*.sh
      - name: Scripts de los disparadores con un aws simulado
        run: ./acciones/probar-acciones.sh
      - name: Revisar los disparadores de QA (actionlint)
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.8 -color
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Construir el backend
        working-directory: plataforma/backend
        run: ./mvnw -B -q package -DskipTests
      - name: Servidor de AWS en Docker (nginx, /rpc, HU20 y persistencia)
        run: ./servidor/probar-servidor.sh ../../backend/target/plataforma-backend-*.jar

  # DRA-78: revisión estática. Informativa: no bloquea la CI (continue-on-error); los hallazgos se
  # ven en SonarQube Cloud, en el resumen del job y en la pestaña Security del repositorio.
  sonarqube:
    name: Revisión estática (SonarQube Cloud)
    runs-on: ubuntu-latest
    needs: [backend, frontend, portal]
    # En los PR que vienen de otro repositorio (Dependabot, forks) no hay acceso al secreto.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: SonarQube calcula el código nuevo y los autores con git.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: backend-analisis
          path: plataforma/backend/target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-cobertura
          path: plataforma/frontend/coverage
      - uses: actions/download-artifact@v8
        with:
          name: portal-cobertura
          path: plataforma/portal/coverage
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Bibliotecas del backend (para entender los tipos)
        working-directory: plataforma/backend
        run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=test
      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  analisis-contrato-y-secretos:
    name: Revisión estática (contrato y secretos)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo: gitleaks busca secretos en todos los commits.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plataforma/contracts/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencias del contrato (OpenZeppelin)
        working-directory: plataforma/contracts
        run: npm ci
      - name: Contrato con Slither
        working-directory: plataforma/contracts
        env:
          SOLC_VERSION: 0.8.30
        run: |
          pip install --quiet slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.30
          slither contracts/ --solc-remaps "@openzeppelin/=node_modules/@openzeppelin/" \
            --filter-paths node_modules --exclude-dependencies \
            --sarif slither.sarif --fail-none > slither.txt 2>&1 || true
          grep -vE "running$|Multiple frameworks" slither.txt > slither-limpio.txt
          {
            echo "## Slither (contrato)"
            echo '```'
            cat slither-limpio.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Secretos en todo el historial con gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --exit-code 0 \
            --report-format sarif --report-path /repo/gitleaks.sarif 2>&1 | tee gitleaks.txt
          {
            echo "## gitleaks (secretos)"
            echo '```'
            tail -3 gitleaks.txt | sed 's/\x1b\[[0-9;]*m//g'
            jq -r '.runs[0].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' gitleaks.sarif
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: revision-estatica
          path: |
            plataforma/contracts/slither.sarif
            plataforma/contracts/slither-limpio.txt
            gitleaks.sarif
          retention-days: 30
      # Los PR de otro repositorio no pueden publicar en la pestaña Security.
      - name: Publicar Slither en la pestaña Security
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: plataforma/contracts/slither.sarif
          category: slither
      - name: Publicar gitleaks en la pestaña Security
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
