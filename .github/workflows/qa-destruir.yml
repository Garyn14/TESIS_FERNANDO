# QA – Destruir (DRA-52): borra TODO el ambiente de QA en AWS, con sus datos: servidor, disco,
# buckets, distribuciones de CloudFront, secretos, contrato y billeteras de prueba. No se puede
# deshacer. Para dejar de pagar sin perder nada, use "QA – Apagar". El próximo "QA – Encender"
# crea un QA nuevo y vacío, con direcciones de CloudFront nuevas.
name: QA – Destruir

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: Escriba DESTRUIR-QA para borrar QA con todos sus datos
        required: true

concurrency:
  group: ambiente-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2 # región fija de la cuenta (DRA-55)
  AMBIENTE: qa
  TF_IN_AUTOMATION: 'true'

jobs:
  destruir:
    name: Destruir QA
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 45
    defaults:
      run:
        working-directory: plataforma
    steps:
      # Primero el código: los pasos corren en plataforma/, que no existe antes de descargarlo.
      - uses: actions/checkout@v7
      - name: Confirmación
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "DESTRUIR-QA" ]; then
            echo "::error::No se destruyó nada: hay que escribir exactamente DESTRUIR-QA."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # DRA-56: la cuenta prohíbe el proveedor OIDC; la clave es un secreto del ambiente qa.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Destruir la infraestructura (Terraform)
        working-directory: plataforma/infra/aws/qa
        env:
          BUCKET: ${{ vars.TF_ESTADO_BUCKET }}
        run: |
          read -r _ tipo _ <<< "$(../acciones/instancia.sh "$AMBIENTE")" || true
          terraform init -input=false -backend-config="bucket=$BUCKET"
          terraform destroy -input=false -auto-approve -var "tipo_instancia=${tipo:-t4g.medium}"

      # El contrato y las billeteras los crea "QA – Encender", no Terraform.
      - name: Borrar el contrato, las billeteras de prueba y las copias del disco
        run: |
          for ruta in "/dra-satipo/$AMBIENTE" "/dra-satipo/$AMBIENTE-billeteras"; do
            nombres=$(aws ssm get-parameters-by-path --path "$ruta" --recursive --query 'Parameters[].Name' --output text)
            for nombre in $nombres; do
              aws ssm delete-parameter --name "$nombre"
            done
          done
          # DRA-66: las copias del disco no dependen del servidor; si se probaron los respaldos,
          # quedan. Se borran con QA, junto con los discos que dejó una restauración.
          copias=$(aws ec2 describe-snapshots --owner-ids self \
            --filters "Name=tag:Ambiente,Values=$AMBIENTE" "Name=tag-key,Values=TipoDeRespaldo" \
            --query 'Snapshots[].SnapshotId' --output text)
          for copia in $copias; do
            aws ec2 delete-snapshot --snapshot-id "$copia"
          done
          discos=$(aws ec2 describe-volumes --filters "Name=tag:Name,Values=dra-satipo-$AMBIENTE" \
            "Name=status,Values=available" --query 'Volumes[].VolumeId' --output text)
          for disco in $discos; do
            aws ec2 delete-volume --volume-id "$disco"
          done
          echo "QA destruido, con todos sus datos. El próximo **QA – Encender** crea uno nuevo y vacío." >> "$GITHUB_STEP_SUMMARY"
