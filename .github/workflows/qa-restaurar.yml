# QA – Restaurar respaldo (DRA-66): reemplaza el disco del servidor de QA por el de una copia.
# Todo vuelve al momento de la copia, la blockchain incluida: lo registrado y firmado después se
# pierde. El servidor, sus direcciones y CloudFront no cambian. El Director debe restablecer la
# cuenta en MetaMask (docs/arquitectura/respaldos.md). Sin copia indicada, solo lista las copias.
name: QA – Restaurar respaldo

on:
  workflow_dispatch:
    inputs:
      copia:
        description: Identificador de la copia (snap-…). Vacío = solo listar las copias disponibles
        required: false
        default: ''
      confirmacion:
        description: Escriba RESTAURAR-QA para reemplazar el disco del servidor por la copia
        required: false
        default: ''

concurrency:
  group: ambiente-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2 # región fija de la cuenta (DRA-55)
  AMBIENTE: qa

jobs:
  restaurar:
    name: Restaurar QA
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 60
    defaults:
      run:
        # bash explícito: GitHub agrega pipefail, y un error antes de "| tee" detiene el paso.
        shell: bash
        working-directory: plataforma
    steps:
      # Primero el código: los pasos corren en plataforma/, que no existe antes de descargarlo.
      - uses: actions/checkout@v7
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Restaurar se ejecuta desde main. Elija la rama main al ejecutar."
          exit 1
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          # DRA-56: la cuenta prohíbe el proveedor OIDC; la clave es un secreto del ambiente qa.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Copias disponibles
        run: |
          {
            echo "### Copias de QA (de la más reciente a la más antigua)"
            echo '```'
            infra/aws/acciones/listar-respaldos.sh "$AMBIENTE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restaurar la copia
        if: inputs.copia != ''
        env:
          COPIA: ${{ inputs.copia }}
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "RESTAURAR-QA" ]; then
            echo "::error::No se restauró nada: hay que escribir exactamente RESTAURAR-QA."
            exit 1
          fi
          infra/aws/acciones/restaurar-respaldo.sh "$AMBIENTE" "$COPIA"
          {
            echo
            echo "QA quedó como en la copia **$COPIA**. Lo registrado y firmado después de esa copia se perdió."
            echo "El Director debe restablecer la cuenta en MetaMask (Configuración → Avanzado → Borrar datos de actividad)."
          } >> "$GITHUB_STEP_SUMMARY"
